name: Publish packages

# Releases: tag a commit on master, e.g.  git tag v0.2.0 && git push origin v0.2.0
# Previews used to be published here on every push to a feature/* branch. Since 24 Oct 2026 they come from the pull
# request's CI run instead (ci.yml, <VersionPrefix>-ci.<1000 + run number>), so each push is built and tested once.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Work out version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            prefix=$(dotnet msbuild src/BJK.Modules.Shared -getProperty:VersionPrefix)
            version="${prefix}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "### Publishing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: dotnet restore BJK.Modules.slnx

      - name: Build
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --solution BJK.Modules.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack BJK.Modules.slnx --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Report version
        run: echo "::notice::Published BJK.Modules.* ${{ steps.version.outputs.value }}"

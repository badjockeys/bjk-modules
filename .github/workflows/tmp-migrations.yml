# TEMPORARY: builds and generates the FastPosting migrations (no local .NET SDK). Removed before review.
name: TMP generate migrations
on:
  push:
    branches: [feature/fast-posting]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore BJK.Modules.slnx
          dotnet tool restore
      - name: Build everything (errors only)
        continue-on-error: true
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore 2>&1 | grep -E "error|Build succeeded" | sort -u | head -80
      - name: Generate migrations
        run: |
          set -e
          dotnet build src/BJK.Modules.Media --configuration Release --no-restore
          dotnet build src/BJK.Modules.Posts --configuration Release --no-restore
          for m in Media:MediaDbContext Posts:PostsDbContext; do
            mod=${m%%:*}; ctx=${m##*:}
            dir=src/BJK.Modules.$mod/Infrastructure/Data/Migrations
            if dotnet ef migrations has-pending-model-changes --project src/BJK.Modules.$mod --context $ctx --configuration Release; then
              echo "$mod: no changes"; continue
            fi
            rm -f $dir/*_FastPosting.cs $dir/*_FastPosting.Designer.cs
            git checkout origin/feature/online-safety -- $dir/${ctx}ModelSnapshot.cs || true
            dotnet ef migrations add FastPosting --project src/BJK.Modules.$mod --context $ctx --output-dir Infrastructure/Data/Migrations --configuration Release
          done
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B tmp/fast-posting-migrations
          git add src/*/Infrastructure/Data/Migrations
          git commit -m "Generated migrations" || echo "nothing to commit"
          git push -f origin tmp/fast-posting-migrations

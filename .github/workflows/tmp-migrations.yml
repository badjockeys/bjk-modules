# Temporary: generates the EF migration for this branch's model changes. Removed before review.
name: tmp-migrations
on:
  push:
    branches: [feature/post-types]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore BJK.Modules.slnx && dotnet tool restore
      - run: dotnet build BJK.Modules.slnx --configuration Release --no-restore
      - name: Add migrations
        run: |
          set -e
          dir=src/BJK.Modules.Posts/Infrastructure/Data/Migrations
          if dotnet ef migrations has-pending-model-changes --project src/BJK.Modules.Posts --context PostsDbContext --configuration Release --no-build; then
            echo "no changes"; exit 0
          fi
          dotnet ef migrations add PostTypes --project src/BJK.Modules.Posts --context PostsDbContext --output-dir Infrastructure/Data/Migrations --configuration Release
          git -c user.name=ci -c user.email=ci@example.com add -A src
          git -c user.name=ci -c user.email=ci@example.com commit -m "Generated migration"
          git push origin HEAD:refs/heads/tmp/post-types-migrations --force

# TEMPORARY: builds the modules and generates the OnlineSafety migrations (no local .NET SDK). Removed before review.
name: TMP generate migrations
on:
  push:
    branches: [feature/online-safety]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore BJK.Modules.slnx
          dotnet tool restore
      - name: Build modules
        run: |
          dotnet build src/BJK.Modules.Posts --configuration Release --no-restore
          dotnet build src/BJK.Modules.User --configuration Release --no-restore
          dotnet build src/BJK.Modules.SMS --configuration Release --no-restore
      - name: Generate migrations
        run: |
          set -e
          for m in Posts:PostsDbContext Profiles:ProfilesDbContext; do
            mod=${m%%:*}; ctx=${m##*:}
            dir=src/BJK.Modules.$mod/Infrastructure/Data/Migrations
            if dotnet ef migrations has-pending-model-changes --project src/BJK.Modules.$mod --context $ctx --configuration Release; then
              echo "$mod: no changes"; continue
            fi
            rm -f $dir/*_OnlineSafety.cs $dir/*_OnlineSafety.Designer.cs
            git checkout origin/master -- $dir/${ctx}ModelSnapshot.cs
            dotnet ef migrations add OnlineSafety --project src/BJK.Modules.$mod --context $ctx --output-dir Infrastructure/Data/Migrations --configuration Release
          done
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B tmp/online-safety-migrations
          git add src/*/Infrastructure/Data/Migrations
          git commit -m "Generated migrations" || echo "nothing to commit"
          git push -f origin tmp/online-safety-migrations

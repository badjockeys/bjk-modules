# Temporary: generates the EF migration for the new Notifications module. Removed before review.
name: tmp-migrations
on:
  push:
    branches: [feature/notifications]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore BJK.Modules.slnx && dotnet tool restore
      - run: dotnet build BJK.Modules.slnx --configuration Release --no-restore
      - name: Add migrations
        run: |
          set -e
          dotnet ef migrations add InitialCreate --project src/BJK.Modules.Notifications --context NotificationsDbContext --output-dir Infrastructure/Data/Migrations --configuration Release
          git -c user.name=ci -c user.email=ci@example.com add -A src
          git -c user.name=ci -c user.email=ci@example.com commit -m "Generated migrations"
          git push origin HEAD:refs/heads/tmp/notifications-migrations --force

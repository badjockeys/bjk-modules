# Temporary: builds, tests and generates the EF migration for this branch's model change. Removed before review.
name: tmp-migrations
on:
  push:
    branches: [feature/faces-dont-hold]
permissions:
  contents: write
  packages: read
env:
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build, test and add the migration
        continue-on-error: true
        run: |
          exec > >(tee migration.log) 2>&1
          set -e
          dotnet restore BJK.Modules.slnx && dotnet tool restore
          dotnet build BJK.Modules.slnx --configuration Release --no-restore 2>&1 | grep -E "error|Build succeeded" | sort -u | head -150 || true
          dotnet ef migrations add SegmentContentChecks --project src/BJK.Modules.Media --context MediaDbContext --output-dir Infrastructure/Data/Migrations --configuration Release
      - name: Push
        if: ${{ always() }}
        run: |
          git add -f migration.log
          git add -A src || true
          git -c user.name=ci -c user.email=ci@example.com commit -m "Generated migrations"
          git push origin HEAD:refs/heads/tmp/segment-content-migrations --force

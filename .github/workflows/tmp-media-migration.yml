# Temporary: generates the Media module's first EF migration on GitHub's runner and commits it
# back to this branch. Removed again before the pull request is merged.
name: Generate Media migration (temporary)

on:
  push:
    branches: [feature/media-module]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if migrations already exist
        id: check
        run: |
          if [ -d src/BJK.Modules.Media/Infrastructure/Data/Migrations ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.exists != 'true'
        with:
          global-json-file: global.json

      - name: Generate migration
        if: steps.check.outputs.exists != 'true'
        run: |
          annotate() { echo "::error::$(grep -E 'error|Error' "$1" | sort -u | head -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          dotnet tool restore
          dotnet restore BJK.Modules.slnx > restore.log 2>&1 || { annotate restore.log; exit 1; }
          dotnet build src/BJK.Modules.Media --no-restore > build.log 2>&1 || { annotate build.log; exit 1; }
          dotnet ef migrations add InitialCreate \
            --project src/BJK.Modules.Media --context MediaDbContext \
            --output-dir Infrastructure/Data/Migrations > ef.log 2>&1 || { annotate ef.log; exit 1; }

      - name: Commit migration
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BJK.Modules.Media/Infrastructure/Data/Migrations
          git commit -m "Add InitialCreate migration for the Media module (generated by dotnet ef)"
          git push

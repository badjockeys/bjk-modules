# Temporary: generates this branch's EF migrations on GitHub's runner and commits them back.
# Removed again before the pull request is merged.
#  - User module: InitialCreate regenerated from scratch (the old one was replaced before any release).
#  - Profiles and Posts: AccountLifecycle (adds the deactivation columns).
name: Generate account lifecycle migrations (temporary)

on:
  push:
    branches: [feature/account-lifecycle]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check which migrations are missing
        id: check
        run: |
          [ -d src/BJK.Modules.User/Infrastructure/Data/Migrations ] || echo "user=true" >> "$GITHUB_OUTPUT"
          ls src/BJK.Modules.Profiles/Infrastructure/Data/Migrations/*_AccountLifecycle.cs >/dev/null 2>&1 || echo "profiles=true" >> "$GITHUB_OUTPUT"
          ls src/BJK.Modules.Posts/Infrastructure/Data/Migrations/*_AccountLifecycle.cs >/dev/null 2>&1 || echo "posts=true" >> "$GITHUB_OUTPUT"
          grep -q true "$GITHUB_OUTPUT" && echo "any=true" >> "$GITHUB_OUTPUT" || true

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.any == 'true'
        with:
          global-json-file: global.json

      - name: Build
        if: steps.check.outputs.any == 'true'
        run: |
          annotate() { echo "::error::$(grep -E 'error' "$1" | sort -u | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          dotnet tool restore
          dotnet restore BJK.Modules.slnx > restore.log 2>&1 || { annotate restore.log; exit 1; }
          dotnet build BJK.Modules.slnx --no-restore > build.log 2>&1 || { annotate build.log; exit 1; }

      - name: Generate
        if: steps.check.outputs.any == 'true'
        run: |
          ef() { dotnet ef migrations add "$1" --no-build --project "src/$2" --context "$3" --output-dir Infrastructure/Data/Migrations > ef.log 2>&1 || { echo "::error::$(tail -20 ef.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }; }
          if [ "${{ steps.check.outputs.user }}" = "true" ]; then ef InitialCreate BJK.Modules.User UserDbContext; fi
          if [ "${{ steps.check.outputs.profiles }}" = "true" ]; then ef AccountLifecycle BJK.Modules.Profiles ProfilesDbContext; fi
          if [ "${{ steps.check.outputs.posts }}" = "true" ]; then ef AccountLifecycle BJK.Modules.Posts PostsDbContext; fi

      - name: Commit migrations
        if: steps.check.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/*/Infrastructure/Data/Migrations
          git commit -m "Add account lifecycle migrations (generated by dotnet ef)"
          git push

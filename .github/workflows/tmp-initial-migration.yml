# Temporary: generates the User module's first EF migration on GitHub's runner and commits it
# back to this branch. Removed again before the pull request is merged.
name: Generate initial migration (temporary)

on:
  push:
    branches: [feature/user-module-identity]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if migrations already exist
        id: check
        run: |
          if [ -d src/BJK.Modules.User/Infrastructure/Data/Migrations ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.exists != 'true'
        with:
          global-json-file: global.json

      - name: Generate migration
        if: steps.check.outputs.exists != 'true'
        run: |
          dotnet tool restore
          dotnet ef migrations add InitialCreate \
            --project src/BJK.Modules.User --context UserDbContext \
            --output-dir Infrastructure/Data/Migrations

      - name: Commit migration
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BJK.Modules.User/Infrastructure/Data/Migrations
          git commit -m "Add InitialCreate migration for the User module (generated by dotnet ef)"
          git push

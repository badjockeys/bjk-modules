name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # For the media processing tests, which run the real ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      # The face and number plate models (pinned, SHA-256 checked) for the real-model redaction tests and timings.
      - name: Download redaction models
        run: scripts/download-redaction-models.sh "$RUNNER_TEMP/models" --test-images

      - name: Restore
        run: |
          dotnet restore BJK.Modules.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore

      - name: Test
        env:
          BJK_REDACTION_MODELS: ${{ runner.temp }}/models
          BJK_REDACTION_PERF_SECONDS: "60"
        run: |
          set -o pipefail
          if ! dotnet test --solution BJK.Modules.slnx --configuration Release --no-build 2>&1 | tee test-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.User --context UserDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Media --context MediaDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Profiles --context ProfilesDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Posts --context PostsDbContext \
            --configuration Release --no-build

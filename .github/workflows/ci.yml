name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # For the SQL Server tests (migrations apply; outbox and segment progress updates under concurrency).
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # For the media processing tests, which run the real ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      # The face and number plate models (pinned, SHA-256 checked) for the real-model redaction tests and timings.
      - name: Download redaction models
        run: scripts/download-redaction-models.sh "$RUNNER_TEMP/models" --test-images

      - name: Restore
        run: |
          set -o pipefail
          if ! dotnet restore BJK.Modules.slnx 2>&1 | tee restore-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|warn" restore-output.txt | sort -u | head -20 | sed 's/^/::error::/'
            exit 1
          fi
          dotnet tool restore

      - name: Build
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore

      - name: Test
        env:
          BJK_REDACTION_MODELS: ${{ runner.temp }}/models
          BJK_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True;Encrypt=False"
        run: |
          set -o pipefail
          if ! dotnet test --solution BJK.Modules.slnx --configuration Release --no-build 2>&1 | tee test-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          # The test totals (passed, skipped), as notices on the PR.
          grep -E "Test run summary|total:|succeeded:|skipped:" test-output.txt | tail -9 | sed 's/^ */::notice::/' || true

      # The Media tests again, alone, with the timed runs of the real models switched on, so nothing else competes
      # for the CPU. Timings are written to the job summary and shown as notices.
      - name: Redaction timing
        env:
          BJK_REDACTION_MODELS: ${{ runner.temp }}/models
          BJK_REDACTION_PERF_SECONDS: "30"
          BJK_REDACTION_TIMING_FILE: ${{ runner.temp }}/redaction-timing.txt
        run: |
          dotnet test --project tests/BJK.Modules.Media.Tests/BJK.Modules.Media.Tests.csproj --configuration Release --no-build > timing-output.txt 2>&1 || { tail -40 timing-output.txt; exit 1; }
          sed 's/^/::notice::/' "$RUNNER_TEMP/redaction-timing.txt"

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.User --context UserDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Media --context MediaDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Profiles --context ProfilesDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Posts --context PostsDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Notifications --context NotificationsDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Chat --context ChatDbContext \
            --configuration Release --no-build

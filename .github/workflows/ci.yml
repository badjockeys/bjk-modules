name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write   # the pull request's preview packages (below)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but documentation changed. When only Markdown files or docs/ changed, the jobs below are
  # skipped, which still counts as passing for the required "build" check, so docs-only pull requests can merge
  # without spending minutes on a build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, or history that isn't here): build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if grep -qvE '(\.md$|^docs/)' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Changes::$( [ "$code" = true ] && echo 'Code changed: building.' || echo 'Documentation only: build skipped.')"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # For the SQL Server tests (migrations apply; outbox and segment progress updates under concurrency).
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # For the media processing tests, which run the real ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      # The face and number plate models (pinned, SHA-256 checked) for the real-model redaction tests and timings.
      - name: Download redaction models
        run: scripts/download-redaction-models.sh "$RUNNER_TEMP/models" --test-images

      - name: Restore
        run: |
          set -o pipefail
          if ! dotnet restore BJK.Modules.slnx 2>&1 | tee restore-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|warn" restore-output.txt | sort -u | head -20 | sed 's/^/::error::/'
            exit 1
          fi
          dotnet tool restore

      # Pull requests publish preview packages from this build once everything below passes (the last steps), so
      # the packages are built with their version. 1000 + the run number keeps clear of the numbers publish.yml
      # used for previews before 24 Oct 2026 (up to 0.2.0-ci.216).
      - name: Work out the preview version
        id: version
        run: |
          prefix=$(dotnet msbuild src/BJK.Modules.Shared -getProperty:VersionPrefix)
          echo "value=${prefix}-ci.$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        env:
          BJK_REDACTION_MODELS: ${{ runner.temp }}/models
          BJK_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True;Encrypt=False"
        run: |
          set -o pipefail
          if ! dotnet test --solution BJK.Modules.slnx --configuration Release --no-build 2>&1 | tee test-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          # The test totals (passed, skipped), as notices on the PR.
          grep -E "Test run summary|total:|succeeded:|skipped:" test-output.txt | tail -9 | sed 's/^ */::notice::/' || true

      # The Media tests again, alone, with the timed runs of the real models switched on, so nothing else competes
      # for the CPU. Timings are written to the job summary and shown as notices.
      - name: Redaction timing
        env:
          BJK_REDACTION_MODELS: ${{ runner.temp }}/models
          BJK_REDACTION_PERF_SECONDS: "30"
          BJK_REDACTION_TIMING_FILE: ${{ runner.temp }}/redaction-timing.txt
        run: |
          dotnet test --project tests/BJK.Modules.Media.Tests/BJK.Modules.Media.Tests.csproj --configuration Release --no-build > timing-output.txt 2>&1 || { tail -40 timing-output.txt; exit 1; }
          sed 's/^/::notice::/' "$RUNNER_TEMP/redaction-timing.txt"

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.User --context UserDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Media --context MediaDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Profiles --context ProfilesDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Posts --context PostsDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Notifications --context NotificationsDbContext \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/BJK.Modules.Chat --context ChatDbContext \
            --configuration Release --no-build

      # Preview packages for this pull request, so bjk-core and the identity server can use the branch before it
      # merges. Not for pull requests from forks (no package access) or pushes to master.
      - name: Pack the preview packages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: dotnet pack BJK.Modules.slnx --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output artifacts

      - name: Push the preview packages to GitHub Packages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          echo "::notice title=Preview packages::Published BJK.Modules.* ${{ steps.version.outputs.value }}"
          echo "### Preview packages: \`${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"

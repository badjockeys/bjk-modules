name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BJK.Modules.slnx

      - name: Build
        run: dotnet build BJK.Modules.slnx --configuration Release --no-restore

      - name: Test
        run: |
          set -o pipefail
          if ! dotnet test BJK.Modules.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=results" 2>&1 | tee test-output.txt; then
            # Surface the failure lines as annotations on the PR.
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

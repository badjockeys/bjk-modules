# Temporary: generates the Profiles and Posts modules' first EF migrations on GitHub's runner and commits
# them back to this branch. Removed again before the pull request is merged.
name: Generate Profiles and Posts migrations (temporary)

on:
  push:
    branches: [feature/profiles-and-posts]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check which migrations are missing
        id: check
        run: |
          [ -d src/BJK.Modules.Profiles/Infrastructure/Data/Migrations ] || echo "profiles=true" >> "$GITHUB_OUTPUT"
          [ -d src/BJK.Modules.Posts/Infrastructure/Data/Migrations ] || echo "posts=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.profiles == 'true' || steps.check.outputs.posts == 'true'
        with:
          global-json-file: global.json

      - name: Build
        if: steps.check.outputs.profiles == 'true' || steps.check.outputs.posts == 'true'
        run: |
          annotate() { echo "::error::$(grep -E 'error|Error' "$1" | sort -u | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          dotnet tool restore
          dotnet restore BJK.Modules.slnx > restore.log 2>&1 || { annotate restore.log; exit 1; }
          dotnet build src/BJK.Modules.Posts --no-restore > build.log 2>&1 || { annotate build.log; exit 1; }

      - name: Generate Profiles migration
        if: steps.check.outputs.profiles == 'true'
        run: |
          dotnet ef migrations add InitialCreate --no-build \
            --project src/BJK.Modules.Profiles --context ProfilesDbContext \
            --output-dir Infrastructure/Data/Migrations > ef.log 2>&1 || { echo "::error::$(tail -20 ef.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Generate Posts migration
        if: steps.check.outputs.posts == 'true'
        run: |
          dotnet ef migrations add InitialCreate --no-build \
            --project src/BJK.Modules.Posts --context PostsDbContext \
            --output-dir Infrastructure/Data/Migrations > ef.log 2>&1 || { echo "::error::$(tail -20 ef.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Commit migrations
        if: steps.check.outputs.profiles == 'true' || steps.check.outputs.posts == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BJK.Modules.Profiles/Infrastructure/Data/Migrations src/BJK.Modules.Posts/Infrastructure/Data/Migrations 2>/dev/null || true
          git add -A src/*/Infrastructure/Data/Migrations
          git commit -m "Add InitialCreate migrations for the Profiles and Posts modules (generated by dotnet ef)"
          git push
